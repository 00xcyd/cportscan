version: "3.8"
services:
  cportscan:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/cportscan.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - cportscan-data:/app/data

volumes:
  cportscan-data:
